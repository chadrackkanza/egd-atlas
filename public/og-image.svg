<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">EGD Atlas</title>
  <desc id="desc">Carte territoriale, atlas, export et données géospatiales.</desc>
  <defs>
    <linearGradient id="g" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0%" stop-color="#14532d" />
      <stop offset="100%" stop-color="#16a34a" />
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="#f8fafc"/>
  <rect x="40" y="40" width="1120" height="550" rx="32" fill="url(#g)"/>
  <circle cx="220" cy="210" r="100" fill="rgba(255,255,255,0.22)"/>
  <circle cx="320" cy="330" r="56" fill="rgba(255,255,255,0.18)"/>
