  <text x="90" y="230" fill="#f0fdf4" font-size="68" font-family="Segoe UI, Arial, sans-serif" font-weight="700">Cartographie</text>
  <text x="90" y="300" fill="#f0fdf4" font-size="68" font-family="Segoe UI, Arial, sans-serif" font-weight="700">territoriale en RDC</text>
  <text x="90" y="362" fill="#dcfce7" font-size="28" font-family="Segoe UI, Arial, sans-serif">Atlas, données, cartes interactives et exports géospatiaux</text>
